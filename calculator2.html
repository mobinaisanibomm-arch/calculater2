<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>calculator</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3unGdryeXI654GnybHT2icVep9nvrrg7bdtiHO8wGZg&s=10">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="previous"></div>

            <div class="current">
                    <input type="text" placeholder="0">
            </div>
            

        </div>
        <div class="buttons">
            <button class="function">AC</button>
            <button class="function">+/-</button>
            <button class="function">%</button>
            <button class="operator">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">−</button>
        
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
            <button class="zero">0</button>
            <button>.</button>
            <button class="operator">=</button>
        </div>
    </div>

</body>
</html>
